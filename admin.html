<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="display: none;">
  <header>
    <h1>Panel de Administrador</h1>
    <button id="logoutBtn">Cerrar sesión</button>
  </header>

  <main>
    <h2>Usuarios Registrados</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Estatura</th>
          <th>Peso</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="usuariosTabla">
        </tbody>
    </table>
  </main>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h3>Editar Usuario</h3>
      <form id="editForm">
        <input type="hidden" id="editUid">
        <label>Nombre: <input type="text" id="editName"></label>
        <label>Edad: <input type="number" id="editAge"></label>
        <label>Estatura: <input type="number" step="0.01" id="editHeight"></label>
        <label>Peso: <input type="number" step="0.1" id="editWeight"></label>
        <label>Rol: 
          <select id="editRole">
            <option value="user">Usuario</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label>Contraseña: <input type="password" id="editPassword" placeholder="Nueva contraseña (opcional)"></label>
        <button type="submit" class="saveBtn">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <script type="module" src="scripts/admin.js"></script>
</body>
</html>
