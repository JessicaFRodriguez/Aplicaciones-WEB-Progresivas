<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196f3">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo de la aplicación" class="logo">
    </div>
    <h2>Inicio de sesión</h2>

    <form id="loginForm" autocomplete="on">
      <label for="emaillog">Correo:</label>
      <input 
        type="email" 
        id="emaillog" 
        placeholder="ejemplo@correo.com" 
        autocomplete="username" 
        required
      >

      <label for="passwordlog">Contraseña:</label>
      <input 
        type="password" 
        id="passwordlog" 
        placeholder="********" 
        autocomplete="current-password" 
        required
      >

      <button type="button" id="login">Ingresar</button>
      <button type="button" id="cerrar">Cerrar sesión</button>
    </form>

    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
  </div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>
  <script type="module" src="scripts/login.js"></script>
</body>
</html>
